name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-linux
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: true
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15
            target: x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Setup Android NDK
        if: matrix.android == true
        run: |
          # 使用 NDK r26d 避免 Zig translate-c 与 NDK 29 的 _Nullable 语法冲突
          NDK_VERSION=r26d
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          if [ ! -d "$HOME/android-ndk-${NDK_VERSION}" ]; then
            wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
            unzip -q "${NDK_ZIP}" -d "$HOME"
            rm -f "${NDK_ZIP}"
          fi
          NDK_HOME="$HOME/android-ndk-${NDK_VERSION}"
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> $GITHUB_ENV
          echo "NDK_SYSROOT=$SYSROOT" >> $GITHUB_ENV
          echo "Using NDK sysroot: $SYSROOT"

      - name: Build
        run: |
          if [ -n "${{ matrix.android }}" ]; then
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall --sysroot "$NDK_SYSROOT"
          else
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall
          fi

      - name: Test
        if: matrix.android != true
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          if-no-files-found: ignore

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          for dir in artifacts/zmusic-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [[ "$name" == *windows* ]]; then
              (cd "$dir" && zip -r "../../${name}-${version}.zip" .)
            else
              tar czf "${name}-${version}.tar.gz" -C "$dir" .
            fi
          done

      - name: Determine prerelease
        id: prerelease
        run: |
          is_prerelease="false"
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc|pre)\. ]]; then
            is_prerelease="true"
          fi
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
