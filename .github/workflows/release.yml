name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15
            target: x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Test
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/

  build-android:
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android24
            arch: arm64-v8a
          - target: arm-linux-androideabi24
            arch: armeabi-v7a
          - target: x86_64-linux-android24
            arch: x86_64
          - target: i686-linux-android24
            arch: x86

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build Android JNI Library
        run: |
          zig build android \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseSmall \
            --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-android-${{ matrix.arch }}
          path: |
            zig-out/lib/

  release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          
          # 打包桌面版本
          for dir in artifacts/zmusic-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [[ "$name" == *windows* ]]; then
              (cd "$dir" && zip -r "../../${name}-${version}.zip" .)
            else
              tar czf "${name}-${version}.tar.gz" -C "$dir" .
            fi
          done
          
          # 打包 Android 版本
          for dir in artifacts/zmusic-android-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            # 重命名 lib 目录下的 .so 文件，包含架构信息
            pushd "$dir"
            if [[ -d "lib" ]]; then
              # 将 libzmusic.so 重命名为 libzmusic-${arch}.so
              arch="${name#zmusic-android-}"
              if [[ -f "lib/libzmusic.so" ]]; then
                mkdir -p "lib/$arch"
                mv "lib/libzmusic.so" "lib/$arch/libzmusic.so"
              fi
            fi
            popd
            tar czf "${name}-${version}.tar.gz" -C "$dir" .
          done

      - name: Determine prerelease
        id: prerelease
        run: |
          is_prerelease="false"
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc|pre)\. ]]; then
            is_prerelease="true"
          fi
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}