name: Build Android

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build Android JNI Library
        env:
          LIBRARY_PATH: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24
        run: |
          zig build android \
            -Dtarget=aarch64-linux-android \
            -Doptimize=ReleaseSmall \
            --sysroot $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-android-arm64-v8a
          path: |
            zig-out/lib/