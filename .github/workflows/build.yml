name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15
            target: x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Test
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/

  build-android:
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android24
            arch: arm64-v8a
          - target: arm-linux-androideabi24
            arch: armeabi-v7a
          - target: x86_64-linux-android24
            arch: x86_64
          - target: i686-linux-android24
            arch: x86

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build Android JNI Library
        run: |
          zig build android \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseSmall \
            --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-android-${{ matrix.arch }}
          path: |
            zig-out/lib/

  # 可选：合并所有构建产物的报告
  summary:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # 这里可以根据 needs 上下文输出状态
          # 简化版本，实际可以更详细
          echo "| Desktop (Linux, Windows, macOS) | ${{ needs.build-desktop.result }}" >> $GITHUB_STEP_SUMMARY
          echo "| Android (ARM64, ARMv7, x86_64, x86) | ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY