name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-linux
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: true
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15
            target: x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Setup Android NDK
        if: matrix.android == true
        run: |
          # 使用 NDK r26d 避免 Zig translate-c 与 NDK 29 的 _Nullable 语法冲突
          NDK_VERSION=r26d
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          if [ ! -d "$HOME/android-ndk-${NDK_VERSION}" ]; then
            wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
            unzip -q "${NDK_ZIP}" -d "$HOME"
            rm -f "${NDK_ZIP}"
          fi
          NDK_HOME="$HOME/android-ndk-${NDK_VERSION}"
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ARCH=$(echo "${{ matrix.target }}" | cut -d'-' -f1)
          case "$ARCH" in
            aarch64) ANDROID_ARCH=aarch64-linux-android ;;
            x86_64)  ANDROID_ARCH=x86_64-linux-android ;;
            *)       ANDROID_ARCH="" ;;
          esac
          if [ -n "$ANDROID_ARCH" ]; then
            API_LIB_DIR=$(find "$SYSROOT/usr/lib/$ANDROID_ARCH" -maxdepth 1 -type d -name '[0-9]*' | sort -V | tail -1)
            if [ -z "$API_LIB_DIR" ]; then
              API_LIB_DIR="$SYSROOT/usr/lib/$ANDROID_ARCH"
            fi
            echo "ANDROID_LIB_DIR=$API_LIB_DIR" >> $GITHUB_ENV
            echo "Found Android API lib dir: $API_LIB_DIR"
            ls -la "$API_LIB_DIR" || true
          fi
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> $GITHUB_ENV
          echo "NDK_SYSROOT=$SYSROOT" >> $GITHUB_ENV
          echo "Using NDK sysroot: $SYSROOT"

      - name: Build
        run: |
          echo "ANDROID_LIB_DIR=$ANDROID_LIB_DIR"
          ls -la "$ANDROID_LIB_DIR" || true
          if [ -n "${{ matrix.android }}" ]; then
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall --sysroot "$NDK_SYSROOT" --summary all 2>&1 | tee zig-build.log
          else
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall --summary all 2>&1 | tee zig-build.log
          fi

      - name: Test
        if: matrix.android != true
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zig-build-log-${{ matrix.target }}
          path: zig-build.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/

