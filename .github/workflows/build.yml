name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15
            target: x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean cache
        run: |
          rm -rf .zig-cache .zig-cache-tmp ~/.cache/zig || true

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall -fno-cache

      - name: Test
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall -fno-cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Clean cache
        run: |
          rm -rf .zig-cache .zig-cache-tmp ~/.cache/zig || true

      - name: Build Android JNI Library
        run: |
          zig build android \
            -Dtarget=aarch64-linux-android \
            -Doptimize=ReleaseSmall \
            --sysroot $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot \
            -fno-cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-android-arm64-v8a
          path: |
            zig-out/lib/

  summary:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Desktop (Linux, Windows, macOS) | ${{ needs.build-desktop.result }}" >> $GITHUB_STEP_SUMMARY
          echo "| Android (ARM64) | ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY