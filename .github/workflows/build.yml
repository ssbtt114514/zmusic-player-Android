name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-linux
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: true
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15
            target: x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Setup Android NDK
        if: matrix.android == true
        run: |
          # ubuntu-latest 预装了 Android NDK, 路径在 $ANDROID_NDK_LATEST_HOME
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_HOME" ]; then
            echo "::error::Android NDK not found"
            exit 1
          fi
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "NDK_SYSROOT=$SYSROOT" >> $GITHUB_ENV
          echo "Using NDK sysroot: $SYSROOT"

      - name: Build
        run: |
          if [ -n "${{ matrix.android }}" ]; then
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall --sysroot "$NDK_SYSROOT"
          else
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall
          fi

      - name: Test
        if: matrix.android != true
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/

